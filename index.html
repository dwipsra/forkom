    function togglePasswordVisibility(inputId, btnEl) {
      var inp = document.getElementById(inputId);
      if (!inp) return;
      if (inp.type === 'password') {
        inp.type = 'text';
        if (btnEl) btnEl.innerHTML = SVG_ICONS.eyeOff;
      } else {
        inp.type = 'password';
        if (btnEl) btnEl.innerHTML = SVG_ICONS.eye;
      }
    }

    function makeMenuBadgeIcon(svgStr) {

    var SESSION_STORAGE_KEY = 'forkom_rsml_active_session_v2';

    function formatDriveImgUrl(url, fallback) {
      if (!url) return fallback || '';
      var str = String(url).trim();
      if (str.indexOf('data:image/') === 0) return str;

      var driveIdMatch =
        str.match(/\/d\/([a-zA-Z0-9_-]+)/) ||
        str.match(/[?&]id=([a-zA-Z0-9_-]+)/) ||
        str.match(/googleusercontent\.com\/d\/([a-zA-Z0-9_-]+)/);

      if (driveIdMatch && driveIdMatch[1]) {
        return 'https://drive.google.com/thumbnail?id=' + driveIdMatch[1] + '&sz=w1200';
      }
      return str;
    }

    function getActiveAppIconUrl() {
      var customConst = typeof APP_ICON_URL === 'string' ? APP_ICON_URL.trim() : '';
      var stateIcon = appState && appState.appIconUrl ? String(appState.appIconUrl).trim() : '';
      var chosen = customConst || stateIcon || DEFAULT_APP_ICON;
      return formatDriveImgUrl(chosen, DEFAULT_APP_ICON);
    }

    function applyDynamicAppIcon() {
      var iconUrl = getActiveAppIconUrl();
      var fav = document.getElementById('dynamic-favicon');
      var apple = document.getElementById('dynamic-apple-icon');
      var bannerIcon = document.getElementById('pwa-banner-icon');
      var manifestLink = document.getElementById('dynamic-manifest');

      if (fav) fav.href = iconUrl;
      if (apple) apple.href = iconUrl;
      if (bannerIcon) bannerIcon.src = iconUrl;

      if (manifestLink) {
        try {
          var manifestObj = {
            name: 'FORKOM RSML Cabang Pucuk',
            short_name: 'FORKOM',
            start_url: '.',
            display: 'standalone',
            background_color: '#F8FAFC',
            theme_color: '#006837',
            icons: [
              { src: iconUrl, sizes: '192x192', type: 'image/png', purpose: 'any' },
              { src: iconUrl, sizes: '512x512', type: 'image/png', purpose: 'any' }
            ]
          };
          manifestLink.href = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifestObj));
        } catch (e) {}
      }
    }

    function saveUserSession(userObj) {
      try {
        if (userObj) {
          var safeUser = Object.assign({}, userObj);
          delete safeUser.password;
          var serialized = JSON.stringify(safeUser);
          localStorage.setItem(SESSION_STORAGE_KEY, serialized);
          try { sessionStorage.setItem(SESSION_STORAGE_KEY, serialized); } catch (e1) {}
          try {
            var exp = new Date(Date.now() + 365 * 24 * 60 * 60 * 1000).toUTCString();
            document.cookie = SESSION_STORAGE_KEY + '=' + encodeURIComponent(serialized) + '; expires=' + exp + '; path=/; SameSite=Lax';
          } catch (e2) {}
        } else {
          localStorage.removeItem(SESSION_STORAGE_KEY);
          try { sessionStorage.removeItem(SESSION_STORAGE_KEY); } catch (e3) {}
          try {
            document.cookie = SESSION_STORAGE_KEY + '=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/; SameSite=Lax';
          } catch (e4) {}
        }
      } catch (e) {}
    }

    function loadSavedUserSession() {
      var raw = null;
      try { raw = localStorage.getItem(SESSION_STORAGE_KEY); } catch (e1) {}
      if (!raw) {
        try { raw = sessionStorage.getItem(SESSION_STORAGE_KEY); } catch (e2) {}
      }
      if (!raw) {
        try {
          var cookies = document.cookie.split(';');
          for (var i = 0; i < cookies.length; i++) {
            var part = cookies[i].trim();
            if (part.indexOf(SESSION_STORAGE_KEY + '=') === 0) {
              raw = decodeURIComponent(part.substring(SESSION_STORAGE_KEY.length + 1));
              break;
            }
          }
        } catch (e3) {}
      }
      if (!raw) return null;
      try {
        var parsed = normalizeUserObj(JSON.parse(raw));
        if (parsed) {
          saveUserSession(parsed);
        }
        return parsed;
      } catch (e4) {
        return null;
      }
    }

    function getReadMessageIds(nik) {
      try {
        var raw = localStorage.getItem('forkom_read_msgs_' + String(nik || 'guest'));
        return raw ? JSON.parse(raw) : [];
      } catch (e) {
        return [];
      }
    }

    function markMessagesAsRead(nik, ids) {
      try {
        var existing = getReadMessageIds(nik);
        ids.forEach(function(id) {
          if (existing.indexOf(id) === -1) existing.push(id);
        });
        localStorage.setItem('forkom_read_msgs_' + String(nik || 'guest'), JSON.stringify(existing));
      } catch (e) {}
    }

    function isAnnouncementOnly(p) {
      if (!p) return false;
      var judulLow = String(p.judul || '').toLowerCase();
      var urlLow = String(p.fileUrl || '').toLowerCase();
      if (judulLow.indexOf('hasil verifikasi aik') !== -1 || judulLow.indexOf('surat tugas') !== -1 || judulLow.indexOf('sertifikat') !== -1) {
        return false;
      }
      if (urlLow.indexOf('verifikasi_aik_') !== -1 || urlLow.indexOf('surat_tugas_') !== -1 || urlLow.indexOf('sertifikat_') !== -1) {
        return false;
      }
      return true;
    }

        var isMine = (p.tujuan === 'ALL' || String(p.tujuan) === String(nik));

    function getRomanMonth(monthIndex) {
      var romans = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI', 'XII'];
      return romans[monthIndex] || 'I';
    }

    function generateAutoNomorSuratTugas() {
      var now = new Date();
      var maxUrut = 0;
      appState.suratTugasList.forEach(function(item) {
        var m = String(item.nomorSurat || '').match(/^(\d+)/);
        if (m) {
          var num = parseInt(m[1], 10);
          if (!isNaN(num) && num > maxUrut) maxUrut = num;
        }
      });
      var nextUrut = Math.max(maxUrut, appState.suratTugasList.length) + 1;
      var urut = String(nextUrut).padStart(3, '0');
      var bulanRomawi = getRomanMonth(now.getMonth());
      var tahun = now.getFullYear();
      return urut + '/ST/FORKOM.PUCUK/' + bulanRomawi + '/' + tahun;
    }

    function generateAutoNomorSertifikat() {
      var now = new Date();
      var maxUrut = 0;
      appState.sertifikatList.forEach(function(item) {
        var m = String(item.sertifikat || '').match(/^(\d+)/);
        if (m) {
          var num = parseInt(m[1], 10);
          if (!isNaN(num) && num > maxUrut) maxUrut = num;
        }
      });
      var nextUrut = Math.max(maxUrut, appState.sertifikatList.length) + 1;
      var urut = String(nextUrut).padStart(3, '0');
      var bulanRomawi = getRomanMonth(now.getMonth());
      var tahun = now.getFullYear();
      return urut + '/SERT/FORKOM.PUCUK/' + bulanRomawi + '/' + tahun;
    }

    function fileToBase64(file) {
      return new Promise(function(resolve, reject) {
        if (!file) {
          resolve('');
          return;
        }
        if (file.type && file.type.indexOf('image/') === 0 && file.type !== 'image/svg+xml') {
          var readerImg = new FileReader();
          readerImg.readAsDataURL(file);
          readerImg.onload = function(ev) {
            var img = new Image();
            img.onload = function() {
              try {
                var maxDim = 1080;
                var w = img.width;
                var h = img.height;
                if (w > maxDim || h > maxDim) {
                  if (w > h) {
                    h = Math.round((h * maxDim) / w);
                    w = maxDim;
                  } else {
                    w = Math.round((w * maxDim) / h);
                    h = maxDim;
                  }
                }
                var canvas = document.createElement('canvas');
                canvas.width = w;
                canvas.height = h;
                var ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, w, h);
                resolve(canvas.toDataURL('image/jpeg', 0.8));
              } catch (errCanvas) {
                resolve(ev.target.result);
              }
            };
            img.onerror = function() {
              resolve(ev.target.result);
            };
            img.src = ev.target.result;
          };
          readerImg.onerror = function(error) { reject(error); };
          return;
        }

        var reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = function() { resolve(reader.result); };
        reader.onerror = function(error) { reject(error); };
      });
    }

    function callGasWebApi(action, payload) {
      return fetch(GAS_WEB_APP_URL, {
        method: 'POST',
        redirect: 'follow',
        headers: {
          'Content-Type': 'text/plain;charset=utf-8'
        },
        body: JSON.stringify({
          action: action,
          payload: payload || {},
          auth: getCurrentAuthPayload()
        })
      }).then(function(response) {
        if (!response.ok) {
          throw new Error('HTTP ' + response.status);
        }
        return response.json();
      });
    }

    function invokeGasBackend(funcName, payload, onSuccess, onLocalFallback, loadingLabel) {
      var hasGasRunner = (typeof google !== 'undefined' && google.script && google.script.run && typeof google.script.run[funcName] === 'function');
      var authPayload = getCurrentAuthPayload();

      if (!IS_PREVIEW && hasGasRunner) {
        showLoading(loadingLabel || 'Memproses data...');
        try {
          google.script.run
            .withSuccessHandler(function(res) {
              hideLoading();
              if (res && res.error) {
                showToast(res.error, 'error');
                return;
              }
              if (typeof onSuccess === 'function') onSuccess(res);
            })
            .withFailureHandler(function(err) {
              hideLoading();
              showToast('Gagal terhubung ke server: ' + (err && err.message ? err.message : err), 'error');
            })[funcName](payload, authPayload);
        } catch (e) {
          hideLoading();
          showToast('Kesalahan internal: ' + e.message, 'error');
        }
        return;
      }

      if (!IS_PREVIEW && isGasUrlConfigured()) {
        showLoading(loadingLabel || 'Memproses data...');
        callGasWebApi(funcName, payload)
          .then(function(res) {
            hideLoading();
            if (res && res.error) {
              showToast(res.error, 'error');
              return;
            }
            if (typeof onSuccess === 'function') onSuccess(res);
          })
          .catch(function(err) {
            hideLoading();
            showToast('Gagal terhubung ke server GAS: ' + (err && err.message ? err.message : err), 'error');
          });
        return;
      }

      if (!isGasUrlConfigured() && !hasGasRunner) {
        showToast('URL Backend GAS belum diisi di index.html (GAS_WEB_APP_URL)!', 'error');
      }
      if (typeof onLocalFallback === 'function') onLocalFallback();
    }

    var isSyncInFlight = false;
    var lastSyncPayloadHash = '';

    function computeServerPayloadHash(data) {
      if (!data) return '';
      try {
        return JSON.stringify({
          u: Array.isArray(data.users) ? data.users.length : 0,
          jp: Array.isArray(data.jenisPimpinanList) ? data.jenisPimpinanList : [],
          mc: Array.isArray(data.masterCabang) ? data.masterCabang : [],
          mt: Array.isArray(data.masterTtd) ? data.masterTtd : [],
          p: Array.isArray(data.pesanList) ? data.pesanList : [],
          a: Array.isArray(data.aikList) ? data.aikList : [],
          st: Array.isArray(data.suratTugasList) ? data.suratTugasList : [],
          sr: Array.isArray(data.sertifikatList) ? data.sertifikatList : [],
          pr: Array.isArray(data.presensiList) ? data.presensiList : [],
          rek: data.rekeningAIK || {},
          hb: data.heroBannerUrl || '',
          dk: data.defaultKetuaNama || '',
          ai: data.appIconUrl || ''
        });
      } catch (e) {
        return String(Date.now());
      }
    }

    function handleIncomingServerData(data, onDone, options) {
      options = options || {};
      if (!data || data.error) {
        if (typeof onDone === 'function') onDone(false);
        return;
      }

      var newHash = computeServerPayloadHash(data);
      var hasChanged = newHash !== lastSyncPayloadHash;
      lastSyncPayloadHash = newHash;

      applyServerPayloadToState(data);
      saveLocalAppCache();

      if (hasChanged || !options.silent) {
        var petugasScrollEl = document.getElementById('petugas-scroll-area');
        var adminScrollEl = document.getElementById('admin-scroll-area');
        var prevPetugasScroll = petugasScrollEl ? petugasScrollEl.scrollTop : 0;
        var prevAdminScroll = adminScrollEl ? adminScrollEl.scrollTop : 0;

        renderApp();

        var nextPetugasScrollEl = document.getElementById('petugas-scroll-area');
        var nextAdminScrollEl = document.getElementById('admin-scroll-area');
        if (nextPetugasScrollEl && prevPetugasScroll > 0) nextPetugasScrollEl.scrollTop = prevPetugasScroll;
        if (nextAdminScrollEl && prevAdminScroll > 0) nextAdminScrollEl.scrollTop = prevAdminScroll;
      }

      if (typeof onDone === 'function') onDone(true);
    }

    function syncInitialDataFromGAS(onDone, forceRefresh, options) {
      options = options || {};
      if (isSyncInFlight) {
        if (typeof onDone === 'function') onDone(false);
        return;
      }

      var hasGasRunner = (typeof google !== 'undefined' && google.script && google.script.run && typeof google.script.run.getInitialAppData === 'function');

      if (!IS_PREVIEW && hasGasRunner) {
        isSyncInFlight = true;
        google.script.run
          .withSuccessHandler(function(data) {
            isSyncInFlight = false;
            handleIncomingServerData(data, onDone, options);
          })
          .withFailureHandler(function() {
            isSyncInFlight = false;
            if (typeof onDone === 'function') onDone(false);
          })
          .getInitialAppData(Boolean(forceRefresh));
        return;
      }

      if (!IS_PREVIEW && isGasUrlConfigured()) {
        isSyncInFlight = true;
        callGasWebApi('getInitialAppData', { forceRefresh: Boolean(forceRefresh) })
          .then(function(data) {
            isSyncInFlight = false;
            handleIncomingServerData(data, onDone, options);
          })
          .catch(function() {
            isSyncInFlight = false;
            if (typeof onDone === 'function') onDone(false);
          });
        return;
      }

      if (typeof onDone === 'function') onDone(false);
    }

    function formatPhoneNumber(phone) {
      var str = String(phone || '').trim();
      if (!str || str === '-') return '-';
      if (/^8\d{7,}$/.test(str)) {
        return '0' + str;
      }
      return str;
    }

    function normalizeUserObj(u) {
      if (!u) return null;
      return {
        username: String(u.username || '').trim(),
        role: String(u.role || 'petugas').trim().toLowerCase(),
        namaLengkap: String(u.namaLengkap || 'Karyawan RSML').trim(),
        nik: String(u.nik || '-').trim(),
        unitKerja: String(u.unitKerja || '-').trim(),
        noTelp: formatPhoneNumber(u.noTelp),
        email: String(u.email || '-').trim(),
        forkomDomisili: String(u.forkomDomisili || 'Lamongan').trim(),
        fotoUrl: formatDriveImgUrl(u.fotoUrl, 'https://placehold.co/160x200/E6F4EA/006837?text=Foto')
      };
    }

    function handleLogin(e) {
      if (e && typeof e.preventDefault === 'function') e.preventDefault();
      var uEl = document.getElementById('login-user');
      var pEl = document.getElementById('login-pass');
      var uVal = uEl ? uEl.value.trim() : '';
      var pVal = pEl ? pEl.value.trim() : '';

      if (!uVal || !pVal) {
        showToast('Masukkan Username dan Password!', 'error');
        return;
      }

      invokeGasBackend(
        'loginUser',
        { usernameOrNik: uVal, password: pVal },
        function(res) {
          if (res && res.user) {
            appState.currentUser = normalizeUserObj(res.user);
            saveUserSession(appState.currentUser);
            appState.activePetugasTab = 'beranda';
            appState.activeAdminTab = 'validasi_aik';
            showToast('Selamat datang, ' + appState.currentUser.namaLengkap + '!', 'success');
            renderApp();
            setTimeout(function() { syncInitialDataFromGAS(null, true); }, 200);
          } else {
            showToast('Username atau Password tidak sesuai!', 'error');
          }
        },
        null,
        'Memeriksa akun...'
      );
    }

    function submitDaftarAkun(e) {
      if (e && typeof e.preventDefault === 'function') e.preventDefault();
      var username = document.getElementById('reg-user').value.trim();
      var password = document.getElementById('reg-pass').value.trim();
      var namaLengkap = document.getElementById('reg-nama').value.trim();
      var nik = document.getElementById('reg-nik').value.trim();
      var noTelp = document.getElementById('reg-telp').value.trim();
      var unitKerja = document.getElementById('reg-unit').value.trim();
      var email = document.getElementById('reg-email').value.trim();
      var forkomDomisili = document.getElementById('reg-domisili').value.trim();

      if (!username || !password || !namaLengkap || !nik || !email) {
        showToast('Mohon lengkapi seluruh kolom wajib (*)!', 'error');
        return;
      }

      var newUser = {
        username: username,
        password: password,
        role: 'petugas',
        namaLengkap: namaLengkap,
        nik: nik,
        unitKerja: unitKerja || '-',
        noTelp: formatPhoneNumber(noTelp),
        email: email,
        forkomDomisili: forkomDomisili || 'Lamongan',
        fotoUrl: 'https://placehold.co/160x200/E6F4EA/006837?text=Foto'
      };

      invokeGasBackend('registerUser', newUser, function() {
        var safeUser = Object.assign({}, newUser);
        delete safeUser.password;
        appState.users.push(safeUser);
        saveLocalAppCache();
        closeModal();
        showToast('Pendaftaran akun berhasil! Silakan login.', 'success');
      }, null, 'Mendaftarkan akun...');
    }

    function sendOtpEmail() {
      var emailEl = document.getElementById('forgot-email');
      var email = emailEl ? emailEl.value.trim() : '';
      if (!email) {
        showToast('Masukkan alamat email terlebih dahulu!', 'error');
        return;
      }

      invokeGasBackend(
        'sendPasswordResetOtp',
        { email: email },
        function() {
          document.getElementById('otp-step-1').classList.add('hidden');
          document.getElementById('otp-step-2').classList.remove('hidden');
          showToast('Kode OTP 6 digit berhasil dikirim ke email!', 'success');
        },
        null,
        'Mengirim kode OTP...'
      );
    }

    function verifyOtpAndReset() {
      var email = document.getElementById('forgot-email').value.trim();
      var otpInput = document.getElementById('input-otp').value.trim();
      var newPass = document.getElementById('new-password').value.trim();

      if (!otpInput || !newPass) {
        showToast('Masukkan kode OTP dan password baru!', 'error');
        return;
      }

      invokeGasBackend(
        'verifyOtpAndResetPassword',
        { email: email, otp: otpInput, newPassword: newPass },
        function(res) {
          if (res && res.verified) {
            closeModal();
            showToast('Password berhasil diperbarui! Silakan login.', 'success');
          } else {
            showToast('Kode OTP 6 digit tidak sesuai!', 'error');
          }
        },
        null,
        'Memverifikasi OTP...'
      );
    }

    function switchPetugasTab(tabName) {
      var prevTab = appState.activePetugasTab;
      appState.activePetugasTab = tabName;
      if (tabName !== 'beranda' && prevTab === 'beranda') {
        pushAppHistoryState('tab', tabName);
      }
      if (tabName === 'pesan' && appState.currentUser) {
        var nik = appState.currentUser.nik;
        var myIds = appState.pesanList
          .filter(function(p) { return (p.tujuan === 'ALL' || String(p.tujuan) === String(nik)) && isAnnouncementOnly(p); })
          .map(function(p) { return p.id; });
        markMessagesAsRead(nik, myIds);
      } else if (tabName === 'surat_tugas' && appState.currentUser) {
        var nikSt = appState.currentUser.nik;
        var myStIds = appState.suratTugasList
          .filter(function(s) { return String(s.nikPetugas) === String(nikSt); })
          .map(function(s) { return s.id; });
        markSuratTugasAsRead(nikSt, myStIds);
      } else if (tabName === 'sertifikat' && appState.currentUser) {
        var nikSert = appState.currentUser.nik;
        var mySertIds = appState.sertifikatList
          .filter(function(s) { return String(s.nikPetugas) === String(nikSert); })
          .map(function(s) { return s.id; });
        markSertifikatAsRead(nikSert, mySertIds);
      }
      renderApp();
      var scrollArea = document.getElementById('petugas-scroll-area');
      if (scrollArea) scrollArea.scrollTop = 0;
    }

    function parsePresensiMonthYear(tglStr) {
      var str = String(tglStr || '').trim();
      var yearMatch = str.match(/\b(20\d{2})\b/);
      var yearVal = yearMatch ? yearMatch[1] : '';

      var bulanMap = {
        'jan': 1, 'januari': 1,
        'feb': 2, 'februari': 2,
        'mar': 3, 'maret': 3,
        'apr': 4, 'april': 4,
        'mei': 5, 'may': 5,
        'jun': 6, 'juni': 6,
        'jul': 7, 'juli': 7,
        'agu': 8, 'ags': 8, 'agustus': 8, 'aug': 8,
        'sep': 9, 'sept': 9, 'september': 9,
        'okt': 10, 'oktober': 10, 'oct': 10,
        'nov': 11, 'november': 11,
        'des': 12, 'desember': 12, 'dec': 12
      };

      var monthVal = 0;
      var lower = str.toLowerCase();
      Object.keys(bulanMap).forEach(function(k) {
        if (!monthVal && new RegExp('\\b' + k + '\\b', 'i').test(lower)) {
          monthVal = bulanMap[k];
        }
      });

      if (!monthVal) {
        var slashMatch = str.match(/^\d{1,2}[\/\-](\d{1,2})[\/\-](20\d{2})/);
        if (slashMatch) {
          monthVal = parseInt(slashMatch[1], 10);
          yearVal = yearVal || slashMatch[2];
        } else {
          var isoMatch = str.match(/^(20\d{2})[\/\-](\d{1,2})[\/\-]\d{1,2}/);
          if (isoMatch) {
            yearVal = yearVal || isoMatch[1];
            monthVal = parseInt(isoMatch[2], 10);
          }
        }
      }

      return { month: monthVal, year: yearVal };
    }

    function ambilKoordinatLokasi() {
      var locInput = document.getElementById('prs-lokasi');
      if (!navigator.geolocation) {
        showToast('Geolocation tidak didukung browser ini.', 'error');
        return;
      }
      showLoading('Mengambil koordinat GPS...');
      navigator.geolocation.getCurrentPosition(
        function(pos) {
          hideLoading();
          var lat = pos.coords.latitude.toFixed(5);
          var lng = pos.coords.longitude.toFixed(5);
          var currentVal = locInput && locInput.value.trim() ? locInput.value.trim() + ' — ' : '';
          if (locInput) locInput.value = currentVal + 'GPS (' + lat + ', ' + lng + ')';
          showToast('Koordinat GPS berhasil ditambahkan!', 'success');
        },
        function() {
          hideLoading();
          showToast('Izin lokasi ditolak. Ketik nama lokasi secara manual.', 'info');
        }
      );
    }

    async function handlePresensiFotoSelect(e) {
      var file = e.target.files[0];
      if (!file) return;
      try {
        appState.uploadedPresensiFoto = await fileToBase64(file);
        var nameLabel = document.getElementById('prs-foto-filename');
        if (nameLabel) nameLabel.innerHTML = '<span class="text-[#006837] font-bold">&#10003; Foto terpilih: ' + escapeHtml(file.name) + '</span>';
      } catch (err) {
        showToast('Gagal membaca file foto.', 'error');
      }
    }

    function submitPresensiKegiatan(e) {
      e.preventDefault();
      var user = appState.currentUser;
      var namaKegiatan = document.getElementById('prs-kegiatan').value.trim();
      var lokasi = document.getElementById('prs-lokasi').value.trim();

      if (!appState.uploadedPresensiFoto) {
        showToast('Mohon unggah foto bukti kegiatan terlebih dahulu!', 'error');
        return;
      }

      var newPresensi = {
        id: 'PRS-' + Date.now().toString().slice(-5),
        tanggal: new Date().toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' }),
        nik: user.nik,
        namaPetugas: user.namaLengkap,
        namaKegiatan: namaKegiatan,
        lokasi: lokasi,
        fotoBukti: appState.uploadedPresensiFoto,
        status: 'Hadir'
      };

      var applyLocal = function(res) {
        if (res && res.fotoUrl) {
          newPresensi.fotoUrl = formatDriveImgUrl(res.fotoUrl, newPresensi.fotoBukti);
          newPresensi.fotoBukti = newPresensi.fotoUrl;
        }
        appState.presensiList.unshift(newPresensi);
        appState.uploadedPresensiFoto = null;
        saveLocalAppCache();
        showToast('Presensi kegiatan berhasil dicatat!', 'success');
        renderApp();
      };

      invokeGasBackend('submitPresensiKegiatan', newPresensi, applyLocal, function() { applyLocal(null); }, 'Menyimpan presensi...');
    }

    function buildSearchablePetugasDropdownHtml(config) {
      var petugasOnly = appState.users.filter(function(u) { return u.role === 'petugas'; });
      var allItems = [];
      if (config.includeAllOption) {
        allItems.push({
          value: 'ALL',

          sub: 'Kirim ke seluruh anggota FORKOM'
        });
      }
      petugasOnly.forEach(function(p) {
        allItems.push({
          value: String(p.nik),
          label: (config.prefixItem ? config.prefixItem + ': ' : '') + String(p.namaLengkap || ''),
          sub: 'NIK: ' + String(p.nik || '-') + (p.unitKerja ? ' • ' + String(p.unitKerja) : '')
        });
      });

      var selectedItem = allItems.find(function(it) { return String(it.value) === String(config.selectedValue); }) || allItems[0] || { value: '', label: '-- Pilih Petugas --', sub: '' };

      var itemsHtml = allItems.map(function(it) {
        var searchKey = (it.label + ' ' + it.value + ' ' + it.sub).toLowerCase();
        return [
          '<button type="button"',
            ' data-sd-item="1"',
            ' data-value="' + escapeHtml(it.value) + '"',
            ' data-label="' + escapeHtml(it.label) + '"',
            ' data-search="' + escapeHtml(searchKey) + '"',
            ' onclick="selectSearchableDropdownItem(\'' + config.prefixId + '\', this)"',
            ' class="w-full text-left px-3 py-2 hover:bg-emerald-50 border-b border-slate-100 last:border-b-0 transition block">',
            '<p class="font-bold text-slate-900 text-xs truncate">' + escapeHtml(it.label) + '</p>',
            '<p class="text-[10px] text-slate-500 truncate">' + escapeHtml(it.sub) + '</p>',
          '</button>'
        ].join('');
      }).join('');

      return [
        '<div class="relative" id="' + config.prefixId + '-wrapper">',
          '<input type="hidden" id="' + config.hiddenInputId + '" value="' + escapeHtml(selectedItem.value) + '" required />',
          '<button type="button" id="' + config.prefixId + '-trigger" onclick="toggleSearchableDropdown(\'' + config.prefixId + '\')" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-left flex items-center justify-between gap-2 focus:outline-none focus:border-[#006837]">',
            '<span id="' + config.prefixId + '-display" class="font-semibold text-slate-800 truncate">' + escapeHtml(selectedItem.label) + '</span>',
            '<span class="text-slate-400 text-[10px] shrink-0">&#9662;</span>',
          '</button>',
          '<div id="' + config.prefixId + '-panel" class="hidden absolute left-0 right-0 mt-1 bg-white border border-slate-200 rounded-2xl shadow-xl z-30 overflow-hidden">',
            '<div class="p-2 border-b border-slate-100 bg-slate-50">',
              '<input type="search" id="' + config.prefixId + '-search" oninput="filterSearchableDropdown(\'' + config.prefixId + '\', this.value)" placeholder="Ketik nama atau NIK..." class="w-full px-3 py-2 bg-white border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-[#006837]" />',
            '</div>',
            '<div id="' + config.prefixId + '-list" class="max-h-48 overflow-y-auto divide-y divide-slate-100">',
              itemsHtml || '<p class="text-[11px] text-slate-400 text-center py-3">Tidak ada data petugas.</p>',
            '</div>',
            '<p id="' + config.prefixId + '-empty" class="hidden text-[11px] text-slate-400 text-center py-3">Nama tidak ditemukan.</p>',
          '</div>',
        '</div>'
      ].join('');
    }

    function toggleSearchableDropdown(prefixId) {
      var panel = document.getElementById(prefixId + '-panel');
      if (!panel) return;
      var willOpen = panel.classList.contains('hidden');
      document.querySelectorAll('[id$="-panel"]').forEach(function(el) {
        el.classList.add('hidden');
      });
      if (willOpen) {
        panel.classList.remove('hidden');
        var searchInput = document.getElementById(prefixId + '-search');
        if (searchInput) {
          searchInput.value = '';
          filterSearchableDropdown(prefixId, '');
          setTimeout(function() { searchInput.focus(); }, 30);
        }
      }
    }

    function filterSearchableDropdown(prefixId, query) {
      var q = String(query || '').trim().toLowerCase();
      var listEl = document.getElementById(prefixId + '-list');
      var emptyEl = document.getElementById(prefixId + '-empty');
      if (!listEl) return;
      var items = listEl.querySelectorAll('[data-sd-item="1"]');
      var visibleCount = 0;
      items.forEach(function(btn) {
        var hay = btn.getAttribute('data-search') || '';
        if (!q || hay.indexOf(q) !== -1) {
          btn.classList.remove('hidden');
          visibleCount++;
        } else {
          btn.classList.add('hidden');
        }
      });
      if (emptyEl) {
        if (visibleCount === 0) emptyEl.classList.remove('hidden');
        else emptyEl.classList.add('hidden');
      }
    }

    function selectSearchableDropdownItem(prefixId, btnEl) {
      var val = btnEl.getAttribute('data-value') || '';
      var label = btnEl.getAttribute('data-label') || '';
      var wrapper = document.getElementById(prefixId + '-wrapper');
      if (wrapper) {
        var hiddenInp = wrapper.querySelector('input[type="hidden"]');
        if (hiddenInp) hiddenInp.value = val;
      }
      var displayEl = document.getElementById(prefixId + '-display');
      if (displayEl) displayEl.textContent = label;
      var panel = document.getElementById(prefixId + '-panel');
      if (panel) panel.classList.add('hidden');
    }

    document.addEventListener('click', function(ev) {
      if (!ev.target.closest('[id$="-wrapper"]')) {
        document.querySelectorAll('[id$="-panel"]').forEach(function(el) {
          el.classList.add('hidden');
        });
      }
    });

    function buildMasterUsersListHtml(searchQuery) {
      var q = String(searchQuery || '').trim().toLowerCase();
      var currentUsername = appState.currentUser ? appState.currentUser.username : '';
      var filteredUsers = appState.users.filter(function(u) {
        if (!q) return true;
        return (
          String(u.namaLengkap || '').toLowerCase().indexOf(q) !== -1 ||
          String(u.username || '').toLowerCase().indexOf(q) !== -1 ||
          String(u.nik || '').toLowerCase().indexOf(q) !== -1 ||
          String(u.unitKerja || '').toLowerCase().indexOf(q) !== -1
        );
      });

      if (filteredUsers.length === 0) {
        return '<p class="text-[11px] text-slate-400 text-center py-4">Pengguna dengan kata kunci tersebut tidak ditemukan.</p>';
      }

      return filteredUsers.map(function(u) {
        var isSelf = String(u.username) === String(currentUsername);
        var roleBadge = u.role === 'admin'
          ? '<span class="px-2 py-0.5 rounded bg-purple-100 text-purple-800 font-bold text-[10px]">Admin</span>'
          : '<span class="px-2 py-0.5 rounded bg-emerald-100 text-[#006837] font-bold text-[10px]">Petugas</span>';
        var deleteBtn = isSelf
          ? '<span class="text-[10px] font-semibold text-slate-400 px-2">Akun Aktif</span>'
          : '<button type="button" onclick="konfirmasiHapusUser(\'' + escapeHtml(u.username) + '\')" class="px-2.5 py-1 bg-red-50 hover:bg-red-100 text-red-600 rounded-lg font-bold text-[11px]">Hapus</button>';
        return [
          '<div class="flex items-center justify-between gap-2 p-2.5 bg-slate-50 rounded-xl text-xs border border-slate-100">',
            '<div class="min-w-0 flex-1">',
              '<div class="flex items-center gap-1.5">',
                roleBadge,
                '<span class="font-bold text-slate-900 truncate">' + escapeHtml(u.namaLengkap) + '</span>',
              '</div>',
              '<p class="text-[10px] text-slate-500 truncate mt-0.5">User: ' + escapeHtml(u.username) + ' • NIK: ' + escapeHtml(u.nik) + ' • ' + escapeHtml(u.unitKerja) + '</p>',
            '</div>',
            deleteBtn,
          '</div>'
        ].join('');
      }).join('');
    }

              '<input type="text" id="rek-atasnama" value="' + escapeHtml(rek.atasNama) + '" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl" required />',
              '<button type="submit" class="w-full py-2.5 bg-[#006837] text-white font-bold rounded-xl">Simpan Rekening AIK</button>',
            '</form>',
          '</div>',

          '<div class="bg-white rounded-2xl p-4 soft-shadow border border-slate-100 space-y-3">',
            '<div class="flex items-center justify-between">',
              '<div>',
                '<h2 class="text-sm font-bold text-slate-900">Kelola Data Pengguna (User)</h2>',
                '<p class="text-[11px] text-slate-500">Cari &amp; hapus akun user yang sudah tidak aktif</p>',
              '</div>',
              '<span class="text-[10px] font-bold bg-slate-100 text-slate-700 px-2.5 py-1 rounded-full">' + appState.users.length + ' Akun</span>',
            '</div>',
            '<div>',
              '<input type="search" id="search-master-users" value="' + escapeHtml(currentUserSearch) + '" oninput="onSearchMasterUsers(this.value)" placeholder="Cari nama pengguna atau NIK..." class="w-full px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs" />',
            '</div>',
            '<div id="master-users-list-container" class="max-h-64 overflow-y-auto space-y-1.5">' + usersHtml + '</div>',
          '</div>',
        '</div>'
      ].join('');
    }

    async function submitUpdateAppIcon(e) {
      e.preventDefault();
      var fileInput = document.getElementById('app-icon-file');
      var urlInput = document.getElementById('app-icon-url');
      var rawIcon = urlInput ? urlInput.value.trim() : '';
      var finalIcon = rawIcon || appState.appIconUrl || DEFAULT_APP_ICON;

      if (fileInput && fileInput.files[0]) {
        try {
          finalIcon = await fileToBase64(fileInput.files[0]);
        } catch (err) {
          showToast('Gagal membaca file ikon.', 'error');
          return;
        }
      }

      var applyLocal = function(res) {
        var resolved = (res && res.appIconUrl) ? res.appIconUrl : finalIcon;
        appState.appIconUrl = formatDriveImgUrl(resolved, DEFAULT_APP_ICON);
        applyDynamicAppIcon();
        saveLocalAppCache();
        showToast('Ikon aplikasi kustom berhasil diperbarui!', 'success');
        renderApp();
      };

      invokeGasBackend('updateAppIcon', { iconData: finalIcon }, applyLocal, function() { applyLocal(null); }, 'Menyimpan ikon aplikasi...');
    }

    async function submitUpdateHeroBanner(e) {
      e.preventDefault();
      var fileInput = document.getElementById('hero-banner-file');
      var urlInput = document.getElementById('hero-banner-url').value.trim();
      var finalBanner = urlInput || appState.heroBannerUrl || DEFAULT_HERO_BANNER;

      if (fileInput && fileInput.files[0]) {
        try {
          finalBanner = await fileToBase64(fileInput.files[0]);
        } catch (err) {
          showToast('Gagal membaca file gambar banner.', 'error');
          return;
        }
      }

      var applyLocal = function(res) {
        if (res && res.bannerUrl) {
          finalBanner = formatDriveImgUrl(res.bannerUrl, finalBanner);
        } else {
          finalBanner = formatDriveImgUrl(finalBanner, DEFAULT_HERO_BANNER);
        }
        appState.heroBannerUrl = finalBanner;
        saveLocalAppCache();
        showToast('Header banner beranda berhasil diperbarui!', 'success');
        renderApp();
      };

      invokeGasBackend('updateHeroBanner', { bannerData: finalBanner }, applyLocal, function() { applyLocal(null); }, 'Menyimpan header banner...');
    }

    function submitUpdateDefaultKetua(e) {
      e.preventDefault();
      var selectedNama = document.getElementById('default-ketua-select').value;
      var applyLocal = function() {
        appState.defaultKetuaNama = selectedNama;
        appState.selectedStKetuaNama = selectedNama;
        appState.selectedSertKetuaNama = selectedNama;
        saveLocalAppCache();
        showToast('Ketua default Surat Tugas & Sertifikat disimpan!', 'success');
        renderApp();
      };
      invokeGasBackend('updateDefaultKetua', { defaultKetuaNama: selectedNama }, applyLocal, applyLocal, 'Menyimpan ketua default...');
    }

    function submitTambahJenisPimpinan(e) {
      e.preventDefault();
      var kode = document.getElementById('new-jenis-kode').value.trim().toUpperCase();
      var labelRaw = document.getElementById('new-jenis-label').value.trim();
      if (!kode) return;

      if (appState.jenisPimpinanList.some(function(j) { return j.kode.toUpperCase() === kode; })) {
        showToast('Kode jenis pimpinan sudah ada!', 'error');
        return;
      }

      var newItem = {
        kode: kode,
        label: kode + ' (' + (labelRaw || kode) + ')'
      };

      var applyLocal = function() {
        appState.jenisPimpinanList.push(newItem);
        saveLocalAppCache();
        showToast('Jenis pimpinan ' + kode + ' ditambahkan!', 'success');
        renderApp();
      };

      invokeGasBackend('tambahJenisPimpinan', newItem, applyLocal, applyLocal, 'Menyimpan jenis pimpinan...');
    }

    function hapusJenisPimpinanItem(kode) {
      var kodeUpper = String(kode || '').trim().toUpperCase();
      var applyLocal = function() {
        appState.jenisPimpinanList = appState.jenisPimpinanList.filter(function(j) {
          return String(j.kode || '').trim().toUpperCase() !== kodeUpper;
        });
        if (appState.masterCabangFilter === kodeUpper) {
          appState.masterCabangFilter = 'ALL';
        }
        saveLocalAppCache();
        showToast('Jenis pimpinan ' + kodeUpper + ' dihapus.', 'info');
        renderApp();
      };
      invokeGasBackend('hapusJenisPimpinan', { kode: kodeUpper }, applyLocal, applyLocal, 'Menghapus jenis pimpinan...');
    }

    function konfirmasiHapusUser(username) {
      var targetUser = appState.users.find(function(u) { return String(u.username) === String(username); });
      if (!targetUser) return;
      openModal([
        '<div class="space-y-3 text-xs">',
          '<div class="flex items-center justify-between border-b border-slate-100 pb-2">',
            '<h3 class="font-bold text-red-700">Konfirmasi Hapus User</h3>',
            '<button type="button" onclick="closeModal()" class="p-1.5 rounded-xl bg-slate-100 text-slate-500">&#10005;</button>',
          '</div>',
          '<p class="text-slate-700">Apakah Anda yakin ingin menghapus akun <strong>' + escapeHtml(targetUser.namaLengkap) + '</strong> (Username: ' + escapeHtml(targetUser.username) + ') yang sudah tidak aktif?</p>',
          '<div class="flex gap-2 pt-1">',
            '<button type="button" onclick="closeModal()" class="flex-1 py-2.5 bg-slate-100 text-slate-700 font-bold rounded-xl">Batal</button>',
            '<button type="button" onclick="eksekusiHapusUser(\'' + escapeHtml(targetUser.username) + '\')" class="flex-1 py-2.5 bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl">Ya, Hapus User</button>',
          '</div>',
        '</div>'
      ].join(''));
    }

    function eksekusiHapusUser(username) {
      var applyLocal = function() {
        appState.users = appState.users.filter(function(u) { return String(u.username) !== String(username); });
        saveLocalAppCache();
        closeModal();
        showToast('Akun pengguna berhasil dihapus.', 'info');
        renderApp();
      };
      invokeGasBackend('hapusUserAdmin', { username: username }, applyLocal, applyLocal, 'Menghapus akun user...');
    }

    function submitUpdateRekeningAIK(e) {
      e.preventDefault();
      var updatedRek = {
        bank: document.getElementById('rek-bank').value.trim(),
        noRekening: document.getElementById('rek-nomor').value.trim(),
        atasNama: document.getElementById('rek-atasnama').value.trim()
      };
      var applyLocal = function() {
        appState.rekeningAIK = updatedRek;
        saveLocalAppCache();
        showToast('Rekening AIK berhasil diperbarui!', 'success');
        renderApp();
      };
      invokeGasBackend('updateRekeningAIK', updatedRek, applyLocal, applyLocal, 'Menyimpan rekening...');
    }

    function submitTambahCabang(e) {
      e.preventDefault();
      var namaArea = document.getElementById('new-cabang-nama').value.trim();
      var detectedPrefix = (namaArea.match(/^([A-Za-z]{2,5})\b/) || ['', ''])[1].toUpperCase();
      var newCabang = {
        id: 'CB-' + Date.now(),
        jenis: detectedPrefix,
        nama: namaArea
      };
      var applyLocal = function() {
        appState.masterCabang.unshift(newCabang);
        saveLocalAppCache();
        showToast('Area pimpinan ditambahkan!', 'success');
        renderApp();
      };
      invokeGasBackend('tambahMasterCabang', newCabang, applyLocal, applyLocal, 'Menyimpan area...');
    }

    function hapusCabang(id) {
      var applyLocal = function() {
        appState.masterCabang = appState.masterCabang.filter(function(c) { return c.id !== id; });
        saveLocalAppCache();
        showToast('Area pimpinan dihapus.', 'info');
        renderApp();
      };
      invokeGasBackend('hapusMasterCabang', { id: id }, applyLocal, applyLocal, 'Menghapus area...');
    }

    // =========================================================================
    // 8. RENDERER UTAMA & INISIALISASI
    // =========================================================================
    function renderApp() {
      var root = document.getElementById('app-root');
      if (!root) return;
      try {
        applyDynamicAppIcon();
        if (!appState.currentUser) {
          root.innerHTML = renderLoginScreen();
          bindLoginEvents();
        } else if (appState.currentUser.role === 'admin') {
          root.innerHTML = renderAdminLayout();
        } else {
          root.innerHTML = renderPetugasLayout();
        }
        showInstallBannerIfEligible();
      } catch (err) {
        root.innerHTML = '<div style="padding:24px;color:#dc2626;font-size:12px;font-weight:bold;">Error: ' + err.message + '</div>';
      }
    }

    function bootForkomApp() {
      initMobileBackNavigation();
      var savedSession = loadSavedUserSession();
      if (savedSession) {
        appState.currentUser = savedSession;
      }
      hydrateCachedAppData();
      applyDynamicAppIcon();
      renderApp();
      syncInitialDataFromGAS(null, true);
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', bootForkomApp);
    } else {
      bootForkomApp();
    }

    // =========================================================================
    // 9. AUTO-REFRESH CERDAS (ADAPTIVE POLLING + RESUME SYNC TANPA GANGGU INPUT)
    // =========================================================================
    var AUTO_REFRESH_ACTIVE_MS = 30000;
    var AUTO_REFRESH_IDLE_MS = 60000;
    var lastAutoSyncTime = Date.now();
    var lastUserActivityTime = Date.now();

    function markUserActivity() {
      lastUserActivityTime = Date.now();
    }

    ['touchstart', 'mousedown', 'keydown', 'scroll'].forEach(function(evtName) {
      document.addEventListener(evtName, markUserActivity, { passive: true });
    });

    function isUserActivelyEditing() {
      var modal = document.getElementById('global-modal');
      if (modal && !modal.classList.contains('hidden')) {
        return true;
      }
      var loading = document.getElementById('loading-overlay');
      if (loading && !loading.classList.contains('hidden')) {
        return true;
      }
      var activeEl = document.activeElement;
      if (activeEl) {
        var tag = activeEl.tagName ? activeEl.tagName.toUpperCase() : '';
        if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') {
          return true;
        }
      }
      if (appState.uploadedBuktiFile || appState.uploadedPresensiFoto) {
        return true;
      }
      return false;
    }

    function runSmartAutoRefresh(minCooldownMs) {
      if (!appState.currentUser) return;
      if (document.visibilityState !== 'visible') return;
      if (navigator.onLine === false) return;
      if (isUserActivelyEditing()) return;

      var now = Date.now();
      var cooldown = minCooldownMs || 15000;
      if (now - lastAutoSyncTime < cooldown) return;

      lastAutoSyncTime = now;
      syncInitialDataFromGAS(null, true, { silent: true });
    }

    function scheduleNextAutoRefresh() {
      if (window.__forkomAutoRefreshTimer) {
        clearTimeout(window.__forkomAutoRefreshTimer);
      }
      var isRecentlyActive = (Date.now() - lastUserActivityTime) < 120000;
      var nextDelay = isRecentlyActive ? AUTO_REFRESH_ACTIVE_MS : AUTO_REFRESH_IDLE_MS;
      window.__forkomAutoRefreshTimer = setTimeout(function() {
        runSmartAutoRefresh(20000);
        scheduleNextAutoRefresh();
      }, nextDelay);
    }

    scheduleNextAutoRefresh();

    document.addEventListener('visibilitychange', function() {
      if (document.visibilityState === 'visible') {
        markUserActivity();
        runSmartAutoRefresh(3000);
        scheduleNextAutoRefresh();
      }
    });

    window.addEventListener('pageshow', function(e) {
      if (e.persisted || document.visibilityState === 'visible') {
        markUserActivity();
        runSmartAutoRefresh(3000);
      }
    });

    window.addEventListener('focus', function() {
      markUserActivity();
      runSmartAutoRefresh(3000);
    });

    window.addEventListener('online', function() {
      runSmartAutoRefresh(2000);
    });
  </script>
</body>
